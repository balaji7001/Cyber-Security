domains.forEach(function(d){
  var total=d.sections.reduce(function(a,s){return a+s.topics.length;},0);
  var subs=d.sections.reduce(function(a,s){return s.topics.reduce(function(b,t){return b+(t.s?t.s.length:0);},a);},0);
  var btn=document.createElement('button');
  btn.className='domain-btn';
  btn.dataset.id=d.id;
  btn.innerHTML='<span class="domain-icon"><i class="ti '+d.icon+'" style="color:'+d.color+';font-size:22px"></i></span>'
    +'<div class="domain-label">'+d.label+'</div>'
    +'<div class="domain-count">'+total+' topics &middot; '+subs+' concepts</div>';

// ── TOGGLE PANEL ─────────────────────────────────────────────────
function togglePanel(d,btn){
  var panels=document.getElementById('panels');
  var existing=document.getElementById('panel-'+d.id);

  // Reset all buttons
  document.querySelectorAll('.domain-btn').forEach(function(b){
    b.classList.remove('active');
    b.style.borderColor='';
    b.style.background='';
  });

  // If same domain clicked again — collapse
  if(activeId===d.id){
    if(existing)existing.remove();
    activeId=null;
    return;
  }

  // Remove any existing open panel
  if(activeId){
    var old=document.getElementById('panel-'+activeId);
    if(old)old.remove();
  }

  activeId=d.id;
  btn.classList.add('active');
  btn.style.borderColor=d.color;
  btn.style.background=d.bg;

  // Count totals
  var total=d.sections.reduce(function(a,s){return a+s.topics.length;},0);
  var subs=d.sections.reduce(function(a,s){return s.topics.reduce(function(b,t){return b+(t.s?t.s.length:0);},a);},0);

  var html='<div class="ph">'
    +'<span style="font-size:28px"><i class="ti '+d.icon+'" style="color:'+d.color+'"></i></span>'
    +'<div><div class="pt" style="color:'+d.color+'">'+d.label+'</div>'
    +'<div class="ps">'+d.sections.length+' sections &nbsp;&middot;&nbsp; '+total+' topics &nbsp;&middot;&nbsp; '+subs+' detailed concepts — click any section to study</div></div>'
    +'</div>';

  d.sections.forEach(function(sec){
    html+='<div class="sec-label">'+sec.t+'</div><div class="tg">';
    sec.topics.forEach(function(t){
      var lc=LC[t.l]||LC.Beginner;
      var tags=t.s?t.s.map(function(s){return '<span class="st">'+s+'</span>';}).join(''):'';
      html+='<div class="tc">'
        +'<span class="badge" style="background:'+lc.bg+';color:'+lc.c+'">'+t.l+'</span>'
        +'<div class="tn">'+t.n+'</div>'
        +'<div class="td">'+t.d+'</div>'
        +(tags?'<div class="subtags">'+tags+'</div>':'')
        +'</div>';
    });
    html+='</div>';
  });

  var panel=document.createElement('div');
  panel.className='panel';
  panel.id='panel-'+d.id;
  panel.style.borderColor=d.color+'44';
  panel.innerHTML=html;
  panels.innerHTML='';
  panels.appendChild(panel);
  panel.scrollIntoView({behavior:'smooth',block:'start'});
}
